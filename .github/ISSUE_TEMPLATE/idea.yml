name: Idea
description: Suggest an improvement.
type: Feature
body:
  - type: textarea
    id: what-the-player-gets
    attributes:
      label: What the player gets
      description: Describe the change from the player’s perspective.
    validations:
      required: true
  - type: textarea
    id: who-asked-and-when
    attributes:
      label: Who asked and when
      description: Record the source and date.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
      description: Specs, plans and outside references. Link related issues with GitHub's parent, sub-issue and blocked-by fields instead.
    validations:
      required: false
