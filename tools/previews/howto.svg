<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f93b8"/><stop offset="0.55" stop-color="#c9d4d8"/><stop offset="1" stop-color="#e3d9bf"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d7a55"/><stop offset="1" stop-color="#4a5538"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5f66"/><stop offset="1" stop-color="#2f3237"/></linearGradient>
    <filter id="sh" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1c1c1c" flood-opacity="0.7"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    
  </defs>
  <rect width="1000" height="560" fill="url(#sky)"/>
  <path d="M0 250 L90 212 L190 236 L300 196 L420 240 L520 214 L650 244 L760 204 L880 238 L1000 214 L1000 270 L0 270 Z" fill="#7d8f8a"/>
  <rect y="262" width="1000" height="298" fill="url(#ground)"/>
  <path d="M-120 560 L455 262 L545 262 L1120 560 Z" fill="url(#road)"/>
  <path d="M496 266 L504 266 L518 330 L482 330 Z M480 356 L520 356 L542 440 L458 440 Z M456 470 L544 470 L582 560 L418 560 Z" fill="#c9bd85" opacity="0.4"/>
  <g filter="url(#soft)">
    <rect x="515" y="292" width="34" height="16" rx="4" fill="#26282c"/><rect x="520" y="287" width="24" height="8" rx="3" fill="#3a3d44"/>
    <rect x="450" y="310" width="42" height="19" rx="4" fill="#1d1f23"/><rect x="456" y="304" width="30" height="9" rx="3" fill="#33363c"/>
    <rect x="456" y="298" width="8" height="4" fill="#e8402f"/><rect x="468" y="298" width="8" height="4" fill="#2c8be6"/>
  </g>
  <rect width="1000" height="560" fill="#101216" opacity="0.25"/>
<rect x="150" y="50" width="700" height="460" rx="8" fill="#1c1c1c" fill-opacity="0.78"/>
<path d="M164 64 L170 64 L166 88 L160 88 Z" fill="#f4691b"/>
<text x="180" y="84" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#eeeeee" text-anchor="start" >How to play</text>
<path d="M819 71 L829 81 M829 71 L819 81" stroke="#a8b0c4" stroke-width="2" stroke-linecap="round"/>
<text x="180" y="132" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ff9a6a" text-anchor="start" >Basics</text>
<rect x="180" y="140" width="55.8" height="3" rx="1" fill="#f4691b"/>
<text x="265.8" y="132" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#a8b0c4" text-anchor="start" >Runner</text>
<text x="351.6" y="132" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#a8b0c4" text-anchor="start" >Cop</text>
<text x="409.5" y="132" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#a8b0c4" text-anchor="start" >Resets</text>
<text x="495.3" y="132" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#a8b0c4" text-anchor="start" >Rules</text>
<rect x="170" y="148" width="660" height="1" fill="#a8b0c4" opacity="0.35"/>
<text x="180" y="182" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="16" fill="#eeeeee">One player is the <tspan fill="#f06a5a" font-weight="700">runner</tspan>. Everyone else is a <tspan fill="#5aa4f5" font-weight="700">cop</tspan>.</text>
<text x="180" y="206" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#eeeeee" text-anchor="start" >Everyone drives the same car. The score is how long the runner survives.</text>
<rect x="180" y="220" width="640" height="38" rx="4" fill="#1c1c1c" fill-opacity="0.5"/>
<circle cx="204" cy="239" r="13" fill="none" stroke="#f4691b" stroke-width="2"/><text x="204" y="245" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#ff9a6a" text-anchor="middle" >1</text>
<text x="232" y="245" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#eeeeee" text-anchor="start" >Prep</text>
<text x="340" y="245" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#a8b0c4" text-anchor="start" >Look at your role, set your colour, wait for the host.</text>
<rect x="180" y="266" width="640" height="38" rx="4" fill="#1c1c1c" fill-opacity="0.5"/>
<circle cx="204" cy="285" r="13" fill="none" stroke="#f4691b" stroke-width="2"/><text x="204" y="291" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#ff9a6a" text-anchor="middle" >2</text>
<text x="232" y="291" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#eeeeee" text-anchor="start" >GO</text>
<text x="340" y="291" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#a8b0c4" text-anchor="start" >The runner is released after</text>
<text x="546.8" y="291" font-family="Overpass Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#ff9a6a" text-anchor="start" >3 s</text>
<rect x="180" y="312" width="640" height="38" rx="4" fill="#1c1c1c" fill-opacity="0.5"/>
<circle cx="204" cy="331" r="13" fill="none" stroke="#f4691b" stroke-width="2"/><text x="204" y="337" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#ff9a6a" text-anchor="middle" >3</text>
<text x="232" y="337" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#eeeeee" text-anchor="start" >Head start</text>
<text x="340" y="337" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#a8b0c4" text-anchor="start" >Cops stay frozen for</text>
<text x="490.0" y="337" font-family="Overpass Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#ff9a6a" text-anchor="start" >7 s</text>
<rect x="180" y="358" width="640" height="38" rx="4" fill="#1c1c1c" fill-opacity="0.5"/>
<circle cx="204" cy="377" r="13" fill="none" stroke="#f4691b" stroke-width="2"/><text x="204" y="383" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#ff9a6a" text-anchor="middle" >4</text>
<text x="232" y="383" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#eeeeee" text-anchor="start" >Chase</text>
<text x="340" y="383" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#a8b0c4" text-anchor="start" >Cops hold the runner still within</text>
<text x="582.3" y="383" font-family="Overpass Mono, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#ff9a6a" text-anchor="start" >10 m</text>
<rect x="180" y="404" width="640" height="38" rx="4" fill="#1c1c1c" fill-opacity="0.5"/>
<circle cx="204" cy="423" r="13" fill="none" stroke="#f4691b" stroke-width="2"/><text x="204" y="429" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#ff9a6a" text-anchor="middle" >5</text>
<text x="232" y="429" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#eeeeee" text-anchor="start" >Result</text>
<text x="340" y="429" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#a8b0c4" text-anchor="start" >The time is saved to the leaderboard.</text>
<text x="180" y="470" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#a8b0c4" text-anchor="start" >Whoever has run least goes next.</text>
<g><rect x="720" y="450" width="100" height="38" rx="5" fill="#d85a1c"/>
<text x="770.0" y="474.25" font-family="Overpass, Noto Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >Got it</text>
</g>
</svg>
