    <g id="rear-mirror">
      <path d="M50 139V151" stroke="#006b61" stroke-width="2.5"/>
      <g class="measure halo">
        <text x="64" y="139">Rear mirror</text>
        <text x="64" y="162">200 m</text>
      </g>
    </g>
    <g id="cop">
      <path d="M-9 -8H-4 M4 -8H9 M-9 8H-4 M4 8H9" stroke="#243440" stroke-width="4" stroke-linecap="round"/>
      <path d="M-11 -7H7Q14 -7 15 -2V2Q14 7 7 7H-11Q-14 7 -14 4V-4Q-14 -7 -11 -7Z"
            fill="#305775" stroke="#fff" stroke-width="1.6"/>
      <path d="M4 -4L7 -3V3L4 4Z" fill="#d4e5ec"/>
      <path d="M-5 -4V4" stroke="#eef5df" stroke-width="3"/>
    </g>
    <g id="runner">
      <path d="M0 -9L9 0 0 9 -9 0Z" fill="#90325a" stroke="#fff" stroke-width="2"/>
    </g>
    <g id="view-arrow" fill="#143e42" stroke="#fff" stroke-width="1.2" stroke-linejoin="round">
      <path d="M17 -3H35V-8L49 0 35 8V3H17Z"/>
    </g>
