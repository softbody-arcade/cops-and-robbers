  <rect width="1100" height="803" fill="#fcfaf4"/>
  <g transform="translate(32 0)">
    <text x="0" y="67" class="title">How cops spot the runner</text>
    <text x="0" y="104" class="intro">The arrow follows the cop’s camera. Spotting the runner takes both range and a clear line of sight.</text>
    <path d="M0 130H1036" stroke="#b5c1b5"/>
  </g>

  <g transform="translate(32 0)">
    <text x="0" y="173" class="heading">Looking along the main road</text>
    <g transform="translate(0 195)">
      <g clip-path="url(#map-clip)">
        <g transform="translate(0 12)">
          <use xlink:href="#streets"/>
          <use xlink:href="#looking-east" class="range" transform="translate(170 145)"/>
          <use xlink:href="#buildings"/>
          <path class="axis" d="M50 145H410 M170 25V265"/>
          <path d="M410 139V151 M164 25H176 M164 265H176" stroke="#006b61" stroke-width="2.5"/>
          <g class="measure halo">
            <text x="182" y="31">200 m</text>
            <text x="182" y="272">200 m</text>
            <text x="400" y="135" text-anchor="end">400 m ahead</text>
          </g>
          <use xlink:href="#rear-mirror"/>
          <use xlink:href="#cop" transform="translate(170 145)"/>
          <use xlink:href="#view-arrow" transform="translate(170 145)"/>
          <use xlink:href="#runner" transform="translate(170 319)"/>
          <text x="185" y="325" class="map-label halo" style="fill:#80284f">Runner</text>
        </g>
      </g>
      <rect x=".5" y=".5" width="507" height="407" rx="10" fill="none" stroke="#bcc6b7"/>
    </g>
    <text x="0" y="636" class="caption">The runner is 290 m down the side street.</text>
    <text x="0" y="660" class="caption">At the cop’s side, clear-day sight reaches 200 m.</text>
  </g>

  <g transform="translate(560 0)">
    <text x="0" y="173" class="heading">Looking down the side street</text>
    <g transform="translate(0 195)">
      <g clip-path="url(#map-clip)">
        <g transform="translate(0 12)">
          <use xlink:href="#streets"/>
          <use xlink:href="#looking-south" class="range" transform="translate(170 145)"/>
          <use xlink:href="#buildings"/>
          <path class="axis" d="M50 145H170"/>
          <path d="M170 145V319" stroke="#006b61" stroke-width="3"/>
          <path d="M170 145L206.3 184" stroke="#a95336" stroke-width="2.7"/>
          <path d="M206.3 184L279 262" stroke="#a95336" stroke-width="2" stroke-dasharray="3 5" fill="none"/>
          <path d="M201.8 179.5L210.8 188.5 M201.8 188.5L210.8 179.5" stroke="#853b27" stroke-width="2.5"/>
          <path d="M279 254L287 262 279 270 271 262Z" fill="#f9f1eb" stroke="#92385c" stroke-width="2"/>
          <text x="293" y="267" class="map-label halo" style="fill:#853b27">Hidden here</text>
          <use xlink:href="#rear-mirror"/>
          <use xlink:href="#cop" transform="translate(170 145)"/>
          <use xlink:href="#view-arrow" transform="translate(170 145) rotate(90)"/>
          <use xlink:href="#runner" transform="translate(170 319)"/>
          <text x="185" y="325" class="map-label halo" style="fill:#006b61">In sight</text>
          <text x="482" y="27" class="small" text-anchor="end">Same car heading</text>
        </g>
      </g>
      <rect x=".5" y=".5" width="507" height="407" rx="10" fill="none" stroke="#bcc6b7"/>
    </g>
    <text x="0" y="636" class="caption">Turning the camera brings the same runner into sight.</text>
    <text x="0" y="660" class="caption">Around the corner, the building blocks the view.</text>
  </g>

  <path d="M32 687H1068" stroke="#b5c1b5"/>
  <text x="32" y="725" class="heading">Weather and light</text>
  <text x="32" y="755" class="caption">Fog, rain, snow and darkness shorten sight in every direction. At night, the runner’s lights and nearby streetlights</text>
  <text x="32" y="779" class="caption">can make the runner visible farther away.</text>
</svg>
