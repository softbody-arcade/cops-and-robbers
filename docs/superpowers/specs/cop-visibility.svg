      <path d="M-2 2 L2 -2 M0 9 L9 0 M7 11 L11 7" stroke="#c3bba4" stroke-width="1.3"/>
    </pattern>
    <clipPath id="map-clip"><rect width="508" height="408" rx="10"/></clipPath>
