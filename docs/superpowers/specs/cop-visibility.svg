<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1100" height="803" viewBox="0 0 1100 803" role="img" aria-labelledby="title desc">
  <title id="title">How cops spot the runner</title>
  <desc id="desc">Two maps show the same east-facing police car and a runner 290 metres south.
    In clear daylight the camera reaches 400 metres ahead and 200 metres to the side.
    The rear mirror covers 200 metres due west in both maps. Turning the camera south puts the runner in range. A building
    still hides the runner at an alternate position around the corner.</desc>
