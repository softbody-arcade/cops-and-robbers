      .title { font-size: 45px; font-weight: 700; }
      .intro { font-size: 21px; fill: #3f5651; }
      .heading { font-size: 25px; font-weight: 700; }
      .map-label { font-size: 16px; font-weight: 700; }
      .measure { font-size: 17px; font-weight: 700; fill: #006b61; }
      .caption { font-size: 17px; fill: #304943; }
      .small { font-size: 15px; fill: #476059; }
      .road { fill: none; stroke: #fffefa; stroke-width: 39; }
      .centre { fill: none; stroke: #c4c7bb; stroke-width: 1.4; stroke-dasharray: 9 8; }
      .range { fill: #008a79; fill-opacity: .12; stroke: #00796d; stroke-width: 2.8; }
      .axis { fill: none; stroke: #007d72; stroke-width: 1.4; stroke-dasharray: 3 4; }
      .halo { paint-order: stroke; stroke: #f7f7ec; stroke-width: 4; stroke-linejoin: round; }
    </style>
