      <rect y="-12" width="508" height="420" fill="#edf0e4"/>
      <rect y="-12" width="508" height="420" fill="url(#grid)"/>
      <path class="road" d="M0 145H508 M170 -12V408 M279 145V408 M170 262H508"/>
      <path class="centre" d="M0 145H145 M195 145H254 M304 145H508 M170 -12V123 M170 169V238 M170 285V408 M279 169V238 M279 285V408 M193 262H254 M304 262H508"/>
    </g>
